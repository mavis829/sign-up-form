<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign-up Form</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page">
    <section class="image-section">
      <img class="background-photo" src="background.avif" alt="">
      <div class="logo-section">
        <img src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="odin logo">
        <span class="logo-text">ODIN</span>
      </div>

      <div class="photo-credit">
        Photo by
  <a href="https://unsplash.com/@haliewestphoto">Halie West</a>
  on
  <a href="https://unsplash.com/photos/25xggax4bSA">Unsplash</a>
      </div>
    </section>

    <section class="content-section">
      <div class="introduction-section">
          <p class="intro-main">
    This is not a real onlien service! You know you need something liek this in your life to help you realise deepest dreams. <br>Sign up <em>now</em> to get started.
  </p>

  <p class="intro-secondary">
    you <em>know</em> you want to.
  </p>
      </div>

      <div class="form-section">
        <h2>Let's do this!</h2>

        <form>
        <div class="form-fields">
        <div class="form-field">
         <label for="first-name">FIRST NAME</label>
         <input type="text" id="first-name" name="first-name" placeholder="Thor" required>
        </div>
          
        <div class="form-field">
         <label for="last-name">LAST NAME</label>
         <input type="text" id="last-name" name="last-name" placeholder="Odinson" required>
        </div>

        <div class="form-field">
         <label for="email">EMAIL</label>
         <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        </div>
          
        <div class="form-field">
          <label for="phone-number">PHONE NUMBER</label>
          <input type="tel" id="phone-number" name="phone-number" placeholder="87654321" required>
        </div>
          
        <div class="form-field">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" required>
        </div>
          
        <div class="form-field">
          <label for="confirm-password">CONFIRM PASSWORD</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        
        </div>
        </form>
      </div>

      <div class="account-section">
        <button type="submit">Create Account</button>
        <p class="log-in">
    Already have an account? <a href="https://unsplash.com/@haliewestphoto">Log in</a>
  </p>
      </div>
    </section>
  </main>
</body>
</html>
